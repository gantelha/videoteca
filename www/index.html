<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Minha videoteca</title>
<meta name="theme-color" content="#0e1819">
<style>
:root{color-scheme:dark;--bg:#0e1819;--panel:#142224;--line:#243739;--tx:#e9f0ec;--mu:#8fa8a5;--ac:#f0b84a}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;display:grid;grid-template-columns:270px 1fr}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
aside{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:18px 12px}
aside h1{font:600 22px Georgia,'Iowan Old Style',serif;margin:0 8px 14px}
.tabs{display:flex;gap:4px;margin:0 4px 12px}
.tabs button{flex:1;background:none;border:1px solid var(--line);border-radius:6px;padding:6px}
.tabs .on{background:var(--ac);color:#1b1503;border-color:var(--ac)}
.g{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:7px 8px;color:var(--mu)}
.g:hover{background:#1b2f31;color:var(--tx)}
.g.on{background:#1f393b;color:var(--tx);box-shadow:inset 3px 0 var(--ac)}
.g small{opacity:.7}
.us{display:block;color:var(--mu);font-size:12px;padding:2px 8px 12px}
.sep{border-top:1px solid var(--line);margin:8px 4px}
main{overflow-y:auto;min-width:0}
.bar{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 75%,transparent);padding:16px 22px 14px;display:flex;gap:10px;align-items:center}
#menu{display:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 12px}
#q{flex:1;max-width:520px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;color:var(--tx);font:inherit}
#st{color:var(--mu);font-size:13px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px 14px;padding:4px 22px 40px}
.c{background:none;border:0;padding:0;text-align:left}
.c .p{aspect-ratio:2/3;background:var(--panel);border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.c img{width:100%;height:100%;object-fit:cover;display:block}
.c:hover .p{border-color:var(--ac)}
.c span{display:block;margin-top:6px;font-size:13px;line-height:1.25;color:var(--tx);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{grid-column:1/-1;color:var(--mu);padding:40px 0;max-width:480px}
dialog{border:1px solid var(--line);background:var(--panel);color:var(--tx);border-radius:10px;padding:0;width:min(1000px,96vw);max-height:94vh;overflow:auto}
dialog::backdrop{background:#000b}
.hd{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:14px 18px}
.hd h2{margin:0;font:600 20px Georgia,serif}
.hd div{display:flex;gap:8px}
.b{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 12px}
.b.on{color:var(--ac);border-color:var(--ac)}
video{width:100%;max-height:68vh;background:#000;display:block}
#err{display:none;padding:12px 18px;color:#ffb4a8}
.sel{padding:14px 18px;display:flex;gap:10px;align-items:center}
select{background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font:inherit}
#eps{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;padding:0 18px 18px}
#eps button{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 0}
#eps .on{background:var(--ac);color:#1b1503;border-color:var(--ac)}
#eps .seen{color:var(--mu)}
@media(max-width:760px){body{grid-template-columns:1fr}#menu{display:block}
aside{position:fixed;inset:0 20% 0 0;z-index:20;transform:translateX(-100%);transition:transform .2s}
aside.open{transform:none}#grid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr));padding:4px 14px 40px}.bar{padding:12px 14px}}
label.g{cursor:pointer}
.fs{position:fixed!important;inset:0;width:100%!important;height:100%!important;max-height:none!important;z-index:1000;object-fit:contain}
#cdlg{width:min(460px,94vw)}#cdlg form{padding:18px;display:grid;gap:12px}
#cdlg input{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:10px;font:inherit}
#cdlg small{color:var(--mu)}
@media(max-width:760px){dialog{width:100vw;max-height:100vh;border-radius:0}video{max-height:42vh}}
@media(prefers-reduced-motion:reduce){aside{transition:none}}
</style>
</head>
<body>
<aside id="side"></aside>
<main id="main">
  <div class="bar"><button id="menu">Categorias</button><input id="q" type="search" placeholder="Buscar filmes e séries" autocomplete="off"><span id="st"></span></div>
  <div id="grid"></div>
  <div id="end"></div>
</main>
<dialog id="dlg">
  <div class="hd"><h2 id="ttl"></h2><div><button class="b" id="fav"></button><button class="b" id="fsb">Tela cheia</button><button class="b" id="cls">Fechar</button></div></div>
  <video id="vid" controls preload="metadata"></video>
  <div id="err"></div>
  <div class="sel" id="sel"><label for="ss">Temporada</label><select id="ss"></select></div>
  <div id="eps"></div>
</dialog>
<dialog id="cdlg"><div class="hd"><h2>Lista no GitHub</h2><button class="b" id="ccls">Fechar</button></div><div style="padding:0 18px 18px;display:grid;gap:12px">
<label>Repositório (usuário/nome)<input id="cf" autocomplete="off" placeholder="gantelha/listas"></label>
<label>Token de acesso (só se o repositório for privado)<input id="ck" autocomplete="off" placeholder="github_pat_..."></label>
<small>Coloque a lista na raiz do repositório, como .m3u8 ou compactada em .m3u8.gz. O token fica só neste aparelho.</small>
<button class="b" id="cfgsave">Salvar e verificar</button></div></dialog>
<input id="file" type="file" hidden multiple>
<script>
const $=s=>document.querySelector(s);
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const img=i=>!i?'':i.startsWith('http')?i:'https://image.tmdb.org/t/p/w342/'+i;
let idx,cache={},kind='all',cur=null,view=[],shown=0,token=0,item=null,season=0,curPath=null;
const PAGE=60,grid=$('#grid'),vid=$('#vid'),dlg=$('#dlg');
const full=p=>p.startsWith('http')?p:idx.base+p;
const key=it=>it.t+'|'+it.i;

const DB=new Promise((ok,no)=>{const r=indexedDB.open('videoteca',1);r.onupgradeneeded=()=>r.result.createObjectStore('c');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const idb=async(mode,fn)=>{const db=await DB;return new Promise((ok,no)=>{const t=db.transaction('c',mode),r=fn(t.objectStore('c'));t.oncomplete=()=>ok(r&&r.result);t.onerror=()=>no(t.error)})};
const idbGet=k=>idb('readonly',s=>s.get(k));
const idbSaveAll=(index,lists)=>idb('readwrite',s=>{s.clear();lists.forEach((l,i)=>s.put(l,'g'+i));s.put(index,'index')});
async function load(id){if(!cache[id])cache[id]=(await idbGet('g'+id))||[];return cache[id]}
async function loadIdx(){idx=await idbGet('index');if(!idx)throw 0}

async function parseStreams(streams,prog){
  const groups=new Map(),attr=/([\w-]+)="([^"]*)"/g,epRe=/^(.*?)\s*[Ss](\d+)\s*[Ee](\d+)\s*$/,TM='https://image.tmdb.org/t/p/w600_and_h900_bestv2/';
  let base=null,meta=null,bytes=0,tick=0;
  const handle=line=>{
    if(line.startsWith('#EXTINF')){
      const a={};for(const m of line.matchAll(attr))a[m[1]]=m[2];
      meta=[(a['tvg-name']||line.slice(line.lastIndexOf(',')+1)).trim(),a['tvg-logo']||'',a['group-title']||'Sem grupo'];
    }else if(line&&line[0]!='#'&&meta){
      const m=/^(https?:\/\/[^/]+\/)(.*)$/.exec(line);
      if(!m){meta=null;return}
      base=base||m[1];const path=m[1]==base?m[2]:line;
      let [title,logo,grp]=meta;meta=null;
      if(logo.startsWith(TM))logo=logo.slice(TM.length);
      const ser=line.includes('/series/');
      let g=groups.get(grp);if(!g){g={k:ser?'s':'f',items:new Map()};groups.set(grp,g)}
      const m2=ser&&epRe.exec(title);
      if(m2){
        const name=m2[1].trim(),k=name+'\0'+logo;let it=g.items.get(k);
        if(!it){it={t:name,i:logo,e:[]};g.items.set(k,it)}
        if(!it.e.some(e=>e[2]==path))it.e.push([+m2[2],+m2[3],path]);
      }else g.items.set(title+'\0'+logo+'\0'+path,{t:title,i:logo,u:path});
    }
  };
  const dec=new TextDecoder();
  for(const s of streams){
    const rd=s.getReader();let rest='';
    for(;;){
      const {done,value}=await rd.read();
      const lines=(rest+(value?dec.decode(value,{stream:true}):'')).split('\n');
      rest=done?'':lines.pop();
      for(const l of lines)handle(l.trim());
      if(done)break;
      bytes+=value.length;if(++tick%8==0){prog(bytes);await new Promise(r=>setTimeout(r))}
    }
    meta=null;
  }
  const names=[...groups.keys()].sort((a,b)=>{const ka=groups.get(a).k,kb=groups.get(b).k;return ka<kb?-1:ka>kb?1:a<b?-1:a>b?1:0});
  const index={base,groups:[]},lists=[];
  names.forEach((n,i)=>{
    const g=groups.get(n),items=[...g.items.values()];
    for(const it of items)if(it.e)it.e.sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
    lists.push(items);index.groups.push({id:i,n,k:g.k,c:items.length});
  });
  return {index,lists};
}

let usMsg='';
const setUs=t=>{usMsg=t;const e=$('.us');if(e)e.textContent=t};
const cfg=()=>({repo:'',token:'',...LS('cfg2',{})});
const Cap=window.Capacitor;
function start(){side();if(cur==null){const f=idx.groups.find(g=>g.k=='f');cur=f?f.id:'hist'}show()}
async function ingest(streams){
  setUs('Lendo a lista…');
  const {index,lists}=await parseStreams(streams,b=>setUs('Lendo a lista… '+(b/1048576|0)+' MB'));
  if(!index.groups.length)throw new Error('nenhum item encontrado no arquivo');
  await idbSaveAll(index,lists);cache={};idx=index;cur=null;start();
  setUs(index.groups.reduce((a,g)=>a+g.c,0)+' títulos carregados.');
}
async function upd(force){
  const {repo,token}=cfg();
  if(!repo){setUs('Toque em Configurar lista e informe o repositório do GitHub.');return}
  try{
    setUs('Verificando o GitHub…');
    const H=a=>({Accept:a,'X-GitHub-Api-Version':'2022-11-28',...(token?{Authorization:'Bearer '+token}:{})});
    const r=await fetch(`https://api.github.com/repos/${repo}/contents/`,{headers:H('application/vnd.github+json')});
    if(!r.ok)throw new Error(r.status==404?'repositório não encontrado (se for privado, confira o token)':r.status==401?'token inválido ou expirado':r.status==403?'acesso negado ou limite de uso atingido':'erro '+r.status);
    const files=(await r.json()).filter(f=>f.type=='file'&&/\.m3u8?(\.gz)?$/i.test(f.name));
    if(!files.length)throw new Error('nenhuma lista .m3u8 ou .m3u8.gz na raiz do repositório');
    const st=LS('state',{});
    if(!force&&idx&&files.every(f=>st[f.path]===f.sha)){setUs('Listas em dia.');return}
    const streams=[];
    for(const f of files){
      const gz=/\.gz$/i.test(f.name);
      if(gz&&typeof DecompressionStream=='undefined')throw new Error('este celular não descompacta .gz; envie o .m3u8 sem compactar');
      setUs('Baixando '+f.name+'…');
      const d=await fetch(`https://api.github.com/repos/${repo}/contents/${encodeURI(f.path)}`,{headers:H('application/vnd.github.raw+json')});
      if(!d.ok)throw new Error('falha ao baixar '+f.name+' (erro '+d.status+')');
      streams.push(gz?d.body.pipeThrough(new DecompressionStream('gzip')):d.body);
    }
    await ingest(streams);
    const ns={};files.forEach(f=>ns[f.path]=f.sha);save('state',ns);
    setUs('Atualizado: '+files.map(f=>f.name).join(', ')+'.');
  }catch(e){setUs('GitHub: '+(e.message||e))}
}
function openCfg(){const c=cfg();$('#cf').value=c.repo;$('#ck').value=c.token;$('#cdlg').showModal()}
$('#cfgsave').onclick=()=>{
  let r=$('#cf').value.trim();const m=r.match(/github\.com\/([^/\s]+\/[^/\s#?]+)/);if(m)r=m[1];
  save('cfg2',{repo:r.replace(/\.git$/,''),token:$('#ck').value.trim()});$('#cdlg').close();$('#side').classList.remove('open');upd(true);
};
$('#ccls').onclick=()=>$('#cdlg').close();
$('#file').onchange=async e=>{
  const fl=[...e.target.files];e.target.value='';if(!fl.length)return;
  $('#side').classList.remove('open');
  try{await ingest(fl.map(f=>f.stream()))}catch(x){setUs('Erro: '+(x.message||x))}
};
async function init(){
  side();
  try{await loadIdx();start()}
  catch{grid.innerHTML='<p class="empty">Nenhuma lista carregada ainda. Use <b>Configurar lista</b> ou <b>Importar arquivo .m3u8</b> no menu.</p>';$('#side').classList.add('open')}
  if(cfg().repo)upd();
}
function side(){
  const gs=(idx?idx.groups:[]).filter(g=>kind=='all'||g.k==kind);
  $('#side').innerHTML='<h1>Minha videoteca</h1><button class="g" data-u="1">Atualizar lista</button><button class="g" data-cfg="1">Configurar lista</button><label class="g" for="file">Importar arquivo .m3u8</label><small class="us">'+esc(usMsg)+'</small><div class="tabs">'+
   [['all','Tudo'],['f','Filmes'],['s','Séries']].map(([k,n])=>`<button data-k="${k}" class="${kind==k?'on':''}">${n}</button>`).join('')+'</div>'+
   [['hist','Continuar assistindo',LS('hist',[]).length],['fav','Favoritos',LS('fav',[]).length]].map(([id,n,c])=>`<button class="g ${cur==id?'on':''}" data-g="${id}">${n}<small>${c}</small></button>`).join('')+
   '<div class="sep"></div>'+gs.map(g=>`<button class="g ${cur==g.id?'on':''}" data-g="${g.id}">${esc(g.n.replace(/^(FILMES|SÉRIES)\s*\|\s*/,''))}<small>${g.c}</small></button>`).join('');
}
$('#side').addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.u){upd();return}
  if(t.dataset.cfg){openCfg();return}
  if(t.dataset.k){kind=t.dataset.k;side();return}
  cur=isNaN(t.dataset.g)?t.dataset.g:+t.dataset.g;$('#q').value='';
  $('#side').classList.remove('open');side();show();
});
$('#menu').onclick=()=>$('#side').classList.toggle('open');

async function show(){
  const my=++token,q=norm($('#q').value.trim());let list;
  $('#main').scrollTop=0;
  try{
    if(q){
      $('#st').textContent='Buscando…';
      const ids=idx.groups.filter(g=>kind=='all'||g.k==kind).map(g=>g.id),seen=new Set();list=[];
      for(const id of ids){
        const items=await load(id);if(my!=token)return;
        for(const it of items){if(norm(it.t).includes(q)){const k=key(it);if(!seen.has(k)){seen.add(k);list.push(it)}}}
      }
    }else if(cur=='fav')list=LS('fav',[]);
    else if(cur=='hist')list=LS('hist',[]);
    else{$('#st').textContent='Carregando…';list=await load(cur)}
  }catch{grid.innerHTML='<p class="empty">Falha ao carregar os dados. Atualize as listas.</p>';return}
  if(my!=token)return;
  view=list;shown=0;grid.innerHTML='';
  $('#st').textContent=list.length+' títulos';
  if(!list.length)grid.innerHTML='<p class="empty">'+(q?'Nada encontrado para essa busca.':cur=='fav'?'Abra um título e use Favoritar para ele aparecer aqui.':cur=='hist'?'O que você assistir aparece aqui para retomar depois.':'Categoria vazia.')+'</p>';
  more();
}
function more(){
  if(shown>=view.length)return;
  const part=view.slice(shown,shown+PAGE);
  grid.insertAdjacentHTML('beforeend',part.map((it,j)=>`<button class="c" data-i="${shown+j}"><div class="p">${it.i?`<img loading="lazy" alt="" src="${esc(img(it.i))}">`:''}</div><span>${esc(it.t)}</span></button>`).join(''));
  shown+=part.length;
}
new IntersectionObserver(es=>{if(es[0].isIntersecting)more()},{root:$('#main'),rootMargin:'600px'}).observe($('#end'));
grid.addEventListener('error',e=>{if(e.target.tagName=='IMG')e.target.style.visibility='hidden'},true);
grid.addEventListener('click',e=>{const c=e.target.closest('.c');if(c){const it=view[+c.dataset.i];open(it,it.last)}});
let t0;$('#q').addEventListener('input',()=>{clearTimeout(t0);t0=setTimeout(show,300)});

function open(it,last){
  item=it;$('#ttl').textContent=it.t;favBtn();dlg.showModal();
  const ser=!!it.e;$('#sel').style.display=$('#eps').style.display=ser?'':'none';
  if(!ser){play(it.u);return}
  const seasons=[...new Set(it.e.map(e=>e[0]))];
  $('#ss').innerHTML=seasons.map(s=>`<option value="${s}">${s==0?'Especiais':'Temporada '+s}</option>`).join('');
  let ep=it.e.find(e=>e[2]==last)||it.e[0];
  season=ep[0];$('#ss').value=season;eps();play(ep[2]);
}
function eps(){
  const pos=LS('pos',{});
  $('#eps').innerHTML=item.e.filter(e=>e[0]==season).map(e=>`<button data-p="${esc(e[2])}" class="${e[2]==curPath?'on':''} ${pos[e[2]]?'seen':''}">${e[1]}</button>`).join('');
}
$('#ss').onchange=e=>{season=+e.target.value;eps()};
$('#eps').addEventListener('click',e=>{const b=e.target.closest('button');if(b)play(b.dataset.p)});
function play(p){
  curPath=p;$('#err').style.display='none';
  vid.src=full(p);vid.play().catch(()=>{});
  if(item.e){const ep=item.e.find(e=>e[2]==p);if(ep){season=ep[0];$('#ss').value=season;eps();$('#ttl').textContent=`${item.t} · T${ep[0]} E${ep[1]}`}}
  const h=LS('hist',[]).filter(x=>key(x)!=key(item));h.unshift({...item,last:p});save('hist',h.slice(0,40));
}
vid.addEventListener('loadedmetadata',()=>{const s=LS('pos',{})[curPath];if(s&&s<vid.duration-30)vid.currentTime=s});
let lastSave=0;
vid.addEventListener('timeupdate',()=>{
  if(Date.now()-lastSave<5000||!curPath)return;lastSave=Date.now();
  const p=LS('pos',{});p[curPath]=Math.floor(vid.currentTime);save('pos',p);
});
vid.addEventListener('ended',()=>{
  const p=LS('pos',{});delete p[curPath];save('pos',p);
  if(!item.e)return;const i=item.e.findIndex(e=>e[2]==curPath);
  if(item.e[i+1])play(item.e[i+1][2]);
});
vid.addEventListener('error',()=>{
  const el=$('#err');el.style.display='block';
  el.innerHTML='O navegador não conseguiu tocar este vídeo (formato ou servidor). <button class="b" id="cp">Copiar link para o VLC</button>';
  $('#cp').onclick=()=>navigator.clipboard.writeText(full(curPath)).then(()=>$('#cp').textContent='Link copiado');
});
function favBtn(){const on=LS('fav',[]).some(x=>key(x)==key(item));$('#fav').textContent=on?'Favoritado':'Favoritar';$('#fav').classList.toggle('on',on)}
$('#fav').onclick=()=>{
  let f=LS('fav',[]);const on=f.some(x=>key(x)==key(item));
  f=on?f.filter(x=>key(x)!=key(item)):[{...item},...f];save('fav',f);favBtn();side();
};
dlg.addEventListener('close',()=>{vid.classList.remove('fs');$('#fsb').textContent='Tela cheia';vid.pause();vid.removeAttribute('src');vid.load();curPath=null;side();if(cur=='hist'||cur=='fav')show()});
$('#cls').onclick=()=>dlg.close();
dlg.addEventListener('click',e=>{if(e.target==dlg)dlg.close()});
$('#fsb').onclick=()=>{$('#fsb').textContent=vid.classList.toggle('fs')?'Sair da tela cheia':'Tela cheia'};
const A=Cap&&Cap.Plugins&&Cap.Plugins.App;
if(A)A.addListener('backButton',()=>{
  if(vid.classList.contains('fs'))$('#fsb').click();
  else if(dlg.open)dlg.close();else if($('#cdlg').open)$('#cdlg').close();
  else if($('#side').classList.contains('open')&&idx)$('#side').classList.remove('open');else A.exitApp();
});
init();
</script>
</body>
</html>
